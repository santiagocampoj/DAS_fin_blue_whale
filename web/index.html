<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CetaSight</title>

  <!-- External libraries -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- defer: load now, run after HTML is ready -->
  <script src="js/map.js" defer></script>
  <script src="js/calendar.js" defer></script>
  <script src="js/main.js" defer></script>
</head>




<body>
  <header>
    <h1>CETASight</h1>
    <span>Mediterranean Sea · Blue &amp; Fin Whale Detection</span>
  </header>

  <!-- map -->
  <div id="map"></div>

  <!-- calendar -->
  <div id="heatmap-panel">
    <h2>Detection Calendar — Past 52 Weeks</h2>
    <div class="hm-months" id="hm-months"></div>
    <div class="hm-body">
      <div class="hm-days">
        <div class="hm-day-lbl"></div>
        <div class="hm-day-lbl">Mon</div>
        <div class="hm-day-lbl"></div>
        <div class="hm-day-lbl">Wed</div>
        <div class="hm-day-lbl"></div>
        <div class="hm-day-lbl">Fri</div>
        <div class="hm-day-lbl"></div>
      </div>
      <div class="hm-weeks" id="hm-weeks"></div>
    </div>
    <div class="hm-legend">
      <span>Fewer</span>
      <div class="hm-legend-cell" style="background:#0d2030"></div>
      <div class="hm-legend-cell" style="background:#0a4d3a"></div>
      <div class="hm-legend-cell" style="background:#0d7a56"></div>
      <div class="hm-legend-cell" style="background:#00b874"></div>
      <div class="hm-legend-cell" style="background:#00d4aa"></div>
      <span>More detections</span>
    </div>
  </div>

  <!-- tooltip is invisible by default, calendar.js controls it -->
  <div id="tooltip"></div>

</body>

</html>
